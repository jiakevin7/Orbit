[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Cluster-level prefix-aware routing simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.4", "pandas>=1.2", "seaborn>=0.13"]

[tool.setuptools.packages.find]
include = ["orbit*"]
